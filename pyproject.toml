[project]
name = "format-converter"
version = "0.1.0.dev0"
description = "Local file conversion workspace"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.149.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "natsort>=8.4.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psutil>=7.2.2",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "send2trash>=2.1.0",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "websocket-client>=1.9.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
